name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install package and test dependencies
        run: python -m pip install -e .[dev]

      - name: Run unit tests with pytest
        run: pytest --cov=docktui --cov-report=term --cov-report=json --cov-fail-under=50 tests/

      - name: Enforce measured branch baseline
        run: python -c "import json; t=json.load(open('coverage.json'))['totals']; p=100*t['covered_branches']/max(1,t['num_branches']); print(f'Branch coverage {p:.2f}%'); assert p >= 35"

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-baseline
          path: coverage.json

      - name: CLI smoke test
        run: |
          docktui --version
          docktui --help
          docktui config show

  integration:
    name: Integration (real Docker daemon)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install DockTUI
        run: python -m pip install .

      - name: Start sample containers
        run: |
          docker run -d --name ci-healthy --health-cmd "true" --health-interval 1s busybox sleep 600
          docker run -d --name ci-unhealthy --health-cmd "false" --health-interval 1s --health-retries 1 busybox sleep 600
          docker run --name ci-crashed busybox sh -c "exit 3" || true
          python - <<'PYWAIT'
          import json, subprocess, time
          deadline = time.monotonic() + 40
          while time.monotonic() < deadline:
              rows = json.loads(subprocess.check_output(["docker", "inspect", "ci-healthy", "ci-unhealthy"]))
              states = [r["State"]["Health"]["Status"] for r in rows]
              if states == ["healthy", "unhealthy"]:
                  break
              time.sleep(0.2)
          else:
              raise SystemExit(f"healthcheck timeout: {states}")
          PYWAIT

      - name: Compose lifecycle integration
        env:
          DOCKTUI_INTEGRATION: "1"
        run: python -m unittest tests.test_compose_integration -v

      - name: docktui doctor
        run: |
          docktui doctor
          python - <<'PYDOCTOR'
          from docktui.doctor import run_checks
          from docktui.docker_client import DockerClient
          rows = run_checks(DockerClient())
          for title in ("Docker CLI", "Docker daemon", "Docker Compose"):
              assert any(r.title == title and r.status == "ok" for r in rows), rows
          PYDOCTOR

      - name: docktui status
        run: |
          docktui status
          docktui status --json | python -c "import json,sys; rows=json.load(sys.stdin); assert {r['name'] for r in rows} >= {'ci-healthy','ci-unhealthy','ci-crashed'}, rows"

      - name: docktui check reports CRITICAL (exit 2)
        run: |
          set +e
          docktui check
          code=$?
          set -e
          test "$code" -eq 2

      - name: docktui check passes when problems are excluded (exit 0)
        run: docktui check --exclude ci-unhealthy --exclude ci-crashed --require 'ci-healthy'

  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install linters
        run: python -m pip install "ruff>=0.5.0" "mypy>=1.10.0"

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run mypy
        run: mypy

      - name: Prepare formatting diagnostic patch
        if: failure()
        run: |
          ruff check --fix . || true
          ruff format .
          git diff > /tmp/docktui-format.patch

      - name: Upload formatting diagnostic patch
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: formatting-diagnostic
          path: /tmp/docktui-format.patch
