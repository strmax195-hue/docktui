[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docktui"
dynamic = ["version"]
description = "Zero-dependency terminal dashboard and health checker for Docker: containers, Compose, logs, exec, cleanup, and Nagios-style checks"
readme = "README.md"
authors = [
    { name = "DockTUI Maintainers" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "docker", "docker-compose", "tui", "terminal", "cli", "containers",
    "monitoring", "healthcheck", "nagios", "devops", "sysadmin", "dashboard",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "twine>=5.0.0",
    "ruff>=0.5.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/strmax195-hue/docktui"
Documentation = "https://github.com/strmax195-hue/docktui#readme"
Bug-Tracker = "https://github.com/strmax195-hue/docktui/issues"
Changelog = "https://github.com/strmax195-hue/docktui/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/strmax195-hue/docktui/blob/main/ROADMAP.md"
Source = "https://github.com/strmax195-hue/docktui"

[project.scripts]
docktui = "docktui.cli:main"

[tool.setuptools.packages.find]
include = ["docktui*"]

[tool.setuptools.dynamic]
version = { attr = "docktui.__version__" }

[tool.setuptools.package-data]
docktui = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length is enforced by the formatter; long lines are common in view code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
files = ["docktui"]
warn_unused_ignores = false

[tool.coverage.run]
source = ["docktui"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
